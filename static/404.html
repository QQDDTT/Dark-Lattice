<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>暗阵坐标偏离 · 404 未找到 | Dark Lattice</title>
    <meta name="robots" content="noindex, follow">
    <link rel="stylesheet" href="/css/main.e901993100fda951668e897cf4206b4b0591ac7e6232f08571dc124b788f1566.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #090d16;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 520px;
            padding: 2.5rem;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }
        .badge {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            margin-bottom: 1.5rem;
        }
        h1 {
            font-size: 1.85rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }
        p {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
        .btn {
            padding: 0.65rem 1.4rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: #2563eb;
            color: #fff;
        }
        .btn-primary:hover {
            background: #1d4ed8;
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
    <script>
        (function() {
            var path = window.location.pathname;
            if (path.indexOf('/zh/') !== 0 && path.indexOf('/en/') !== 0 && path.indexOf('/ja/') !== 0) {
                if (path.indexOf('/posts') === 0 || path.indexOf('/research') === 0) {
                    window.location.replace('/zh' + path);
                }
            }
        })();
    </script>
</head>
<body>
    <div class="container">
        <div class="badge">404 NOT FOUND</div>
        <h1>暗阵坐标偏离 · 页面未找到</h1>
        <p>你访问的路径可能已被迁移或重构。系统正在尝试自动重定向，或可直接返回知识矩阵首页。</p>
        <div class="actions">
            <a href="/zh/" class="btn btn-primary">返回首页</a>
            <a href="/zh/posts/" class="btn btn-secondary">浏览所有专栏</a>
        </div>
    </div>
</body>
