<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%" role="img" aria-label="Dark Lattice Nightfield 3D Lattice &amp; Mathematical Research Hero Banner">
  <defs>
    <linearGradient id="dl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05050a"/>
      <stop offset="55%" stop-color="#0b0b16"/>
      <stop offset="100%" stop-color="#070710"/>
    </linearGradient>
    <radialGradient id="dl-violet" cx="72%" cy="48%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#6d28d9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#05050a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dl-cyan" cx="25%" cy="68%" r="38%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#05050a" stop-opacity="0"/>
    </radialGradient>
    <style>
      .dl-title { font-family: 'Space Grotesk', 'Outfit', 'Inter', sans-serif; font-weight: 800; fill: #f8fafc; letter-spacing: -0.04em; }
      .dl-mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; fill: #a78bfa; letter-spacing: 0.14em; }
      .dl-math { font-family: 'Times New Roman', Georgia, serif; font-style: italic; fill: #c4b5fd; opacity: 0.78; }
      .dl-sub { font-family: 'Inter', -apple-system, sans-serif; fill: #94a3b8; font-size: 15px; }
      .lattice-edge { stroke: #8b5cf6; stroke-opacity: 0.28; stroke-width: 1.2; stroke-dasharray: 6 6; animation: edgeShift 4s linear infinite; }
      .lattice-node { fill: #a78bfa; animation: nodePulse 3.2s ease-in-out infinite; }
      .lattice-cube { animation: cubeFloat 7s ease-in-out infinite; }
      @keyframes edgeShift {
        to { stroke-dashoffset: -24; }
      }
      @keyframes nodePulse {
        0%, 100% { r: 4px; opacity: 0.65; }
        50% { r: 6.5px; opacity: 1; }
      }
      @keyframes cubeFloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-12px); }
      }
    </style>
  </defs>

  <rect width="1200" height="400" rx="18" fill="url(#dl-bg)"/>
  <circle cx="860" cy="190" r="280" fill="url(#dl-violet)">
    <animate attributeName="r" values="250;300;250" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="270" r="220" fill="url(#dl-cyan)"/>

  <!-- Background Dot Lattice Matrix -->
  <g fill="#ffffff" fill-opacity="0.08">
    <circle cx="80" cy="60" r="1.5"/><circle cx="160" cy="60" r="1.5"/><circle cx="240" cy="60" r="1.5"/><circle cx="320" cy="60" r="1.5"/><circle cx="400" cy="60" r="1.5"/>
    <circle cx="80" cy="140" r="1.5"/><circle cx="160" cy="140" r="1.5"/><circle cx="240" cy="140" r="1.5"/><circle cx="320" cy="140" r="1.5"/><circle cx="400" cy="140" r="1.5"/>
    <circle cx="80" cy="220" r="1.5"/><circle cx="160" cy="220" r="1.5"/><circle cx="240" cy="220" r="1.5"/><circle cx="320" cy="220" r="1.5"/><circle cx="400" cy="220" r="1.5"/>
    <circle cx="80" cy="300" r="1.5"/><circle cx="160" cy="300" r="1.5"/><circle cx="240" cy="300" r="1.5"/><circle cx="320" cy="300" r="1.5"/><circle cx="400" cy="300" r="1.5"/>
  </g>

  <!-- Left Hero Content -->
  <g transform="translate(68, 66)">
    <rect x="0" y="0" width="290" height="28" rx="14" fill="#111022" stroke="#8b5cf6" stroke-opacity="0.45"/>
    <circle cx="16" cy="14" r="4" fill="#8b5cf6">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="18" class="dl-mono">NIGHTFIELD · 3D RESEARCH PORTAL</text>

    <text x="0" y="92" class="dl-title" font-size="54">DARK LATTICE</text>
    <text x="0" y="134" class="dl-title" font-size="24" fill="#a78bfa">ENGINEERING. RESEARCH. AESTHETICS.</text>
    <text x="0" y="174" class="dl-sub">在点的格阵中，真相潜藏于黑暗 · 面向研究者与极客的 3D 沉浸式学术与工程知识矩阵</text>

    <!-- Mathematical Formula Stream -->
    <g transform="translate(0, 206)">
      <rect x="0" y="0" width="540" height="44" rx="8" fill="#0d0d1a" stroke="#2e2654"/>
      <text x="18" y="28" class="dl-math" font-size="17">ℋ(ψ) = ∫ Ω ∇×E · dS + ∑ λᵢ ⟨φᵢ | ℒ_lattice | φⱼ⟩   ·   KaTeX &amp; BibTeX Ready</text>
    </g>

    <!-- Feature Badges -->
    <g transform="translate(0, 266)">
      <rect x="0" y="0" width="142" height="26" rx="5" fill="#131126" stroke="#4c1d95"/>
      <text x="12" y="17" class="dl-mono" font-size="10.5">HUGO STATIC ENGINE</text>
      <rect x="154" y="0" width="152" height="26" rx="5" fill="#131126" stroke="#4c1d95"/>
      <text x="166" y="17" class="dl-mono" font-size="10.5" fill="#38bdf8">ZH / EN / JA TRILINGUAL</text>
      <rect x="318" y="0" width="150" height="26" rx="5" fill="#131126" stroke="#4c1d95"/>
      <text x="330" y="17" class="dl-mono" font-size="10.5" fill="#10b981">SRI INTEGRITY GUARD</text>
    </g>
  </g>

  <!-- Right 3D Isometric Crystal Lattice -->
  <g transform="translate(880, 205)" class="lattice-cube">
    <!-- Outer Hexagonal Lattice Projection -->
    <polygon points="0,-130 112,-65 112,65 0,130 -112,65 -112,-65" fill="#131026" fill-opacity="0.45" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="1.5"/>
    <polygon points="0,-76 66,-38 66,38 0,76 -66,38 -66,-38" fill="#1e1638" fill-opacity="0.55" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.5"/>

    <!-- Internal Lattice Edges -->
    <line x1="0" y1="-130" x2="0" y2="130" class="lattice-edge"/>
    <line x1="-112" y1="-65" x2="112" y2="65" class="lattice-edge"/>
    <line x1="-112" y1="65" x2="112" y2="-65" class="lattice-edge"/>
    <line x1="0" y1="-130" x2="66" y2="-38" class="lattice-edge"/>
    <line x1="112" y1="-65" x2="66" y2="38" class="lattice-edge"/>
    <line x1="-112" y1="65" x2="-66" y2="-38" class="lattice-edge"/>

    <!-- Pulsing Lattice Nodes -->
    <circle cx="0" cy="-130" r="5" class="lattice-node"/>
    <circle cx="112" cy="-65" r="4.5" class="lattice-node"/>
    <circle cx="112" cy="65" r="5" class="lattice-node"/>
    <circle cx="0" cy="130" r="4.5" class="lattice-node"/>
    <circle cx="-112" cy="65" r="5" class="lattice-node"/>
    <circle cx="-112" cy="-65" r="4.5" class="lattice-node"/>

    <circle cx="0" cy="-76" r="4" fill="#38bdf8"/>
    <circle cx="66" cy="-38" r="4" fill="#38bdf8"/>
    <circle cx="66" cy="38" r="4" fill="#38bdf8"/>
    <circle cx="0" cy="76" r="4" fill="#38bdf8"/>
    <circle cx="-66" cy="38" r="4" fill="#38bdf8"/>
    <circle cx="-66" cy="-38" r="4" fill="#38bdf8"/>

    <!-- Core Singularity -->
    <circle cx="0" cy="0" r="10" fill="#8b5cf6">
      <animate attributeName="r" values="8;13;8" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#a78bfa" stroke-opacity="0.5" stroke-dasharray="4 4">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="1" y="1" width="1198" height="398" rx="17" fill="none" stroke="#8b5cf6" stroke-opacity="0.2" stroke-width="1.5"/>
</svg>
