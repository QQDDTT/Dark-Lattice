<header class="site-header" id="navbar">
    <div class="header-container">
        <a href="{{ .Site.Home.RelPermalink }}" class="logo-link" style="text-decoration: none;">
            <span class="logo-text">{{ .Site.Title }}</span>
        </a>
        <nav class="nav-list" style="display: flex; align-items: center; gap: 2rem;">
            {{ range .Site.Menus.main }}
                <a href="{{ .URL }}" class="nav-link {{ if eq $.Permalink .URL }}active{{ end }}">{{ .Name }}</a>
            {{ end }}
            
            <!-- Language Switcher Placeholder -->
            {{ if .IsTranslated }}
            <select class="language-select" onchange="window.location.href=this.value" style="margin-left: 1rem;">
                {{ range .AllTranslations }}
                    <option value="{{ .Permalink }}" {{ if eq .Language $.Language }}selected{{ end }}>
                        {{ .Language.Params.label }}
                    </option>
                {{ end }}
            </select>
            {{ end }}
        </nav>
    </div>
</header>
