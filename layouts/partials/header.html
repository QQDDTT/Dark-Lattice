<nav class="navbar" id="navbar">
    <a href="{{ .Site.Home.RelPermalink }}" style="text-decoration: none;">
        <h1>{{ .Site.Title }}</h1>
    </a>
    <div class="nav-links" style="display: flex; align-items: center; gap: 2rem;">
        {{ range .Site.Menus.main }}
            <a href="{{ .URL }}" class="page-link {{ if eq $.Permalink .URL }}active{{ end }}" {{ if eq $.Permalink .URL }}style="color: var(--text-main);"{{ end }}>{{ .Name }}</a>
        {{ end }}
        
        <!-- Language Switcher Placeholder -->
        {{ if .IsTranslated }}
        <select class="language-select" onchange="window.location.href=this.value" style="margin-left: 1rem;">
            {{ range .AllTranslations }}
                <option value="{{ .Permalink }}" {{ if eq .Language $.Language }}selected{{ end }}>
                    {{ .Language.Params.label }}
                </option>
            {{ end }}
        </select>
        {{ end }}
    </div>
</nav>
