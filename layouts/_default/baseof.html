<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
<head>
    {{ partial "head.html" . }}
</head>
<body>
    {{ partial "header.html" . }}
    
    <div class="main-content">
        {{ block "main" . }}{{ end }}
    </div>

    {{ partial "footer.html" . }}


    {{ $js := resources.Get "js/main.js" }}
    {{ if $js }}
        {{ $opts := dict 
            "minify" true 
            "format" "esm" 
            "target" "es2020" 
        }}
        {{ $built := $js | js.Build $opts | fingerprint }}
        <script src="{{ $built.RelPermalink }}" integrity="{{ $built.Data.Integrity }}" type="module"></script>
    {{ end }}


</body>
</html>
