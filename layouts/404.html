{{ define "main" }}
<main class="container error-404-container">
    <div class="error-404-content reveal">
        <div class="error-badge">404 ERROR</div>
        <h1 class="error-title">暗阵坐标偏离 · 页面未找到</h1>
        <p class="error-desc">
            你所请求的资源路径不存在或已被移至新的知识矩阵。系统正在尝试自动寻址...
        </p>
        <div class="error-actions">
            <a href="{{ "/zh/" | relLangURL }}" class="btn btn-primary">返回首页</a>
            <a href="{{ "/zh/posts/" | relLangURL }}" class="btn btn-secondary">浏览所有专栏</a>
        </div>
    </div>
</main>

<style>
.error-404-container {
    min-height: 60vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 4rem 1.5rem;
}
.error-404-content {
    max-width: 540px;
    margin: 0 auto;
}
.error-badge {
    display: inline-block;
    padding: 0.25rem 0.75rem;
    background: rgba(59, 130, 246, 0.1);
    color: #60a5fa;
    border: 1px solid rgba(59, 130, 246, 0.25);
    border-radius: 9999px;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    margin-bottom: 1.5rem;
}
.error-title {
    font-size: 2rem;
    font-weight: 700;
    color: #f1f5f9;
    margin-bottom: 1rem;
    line-height: 1.3;
}
.error-desc {
    color: #94a3b8;
    font-size: 1rem;
    line-height: 1.6;
    margin-bottom: 2rem;
}
.error-actions {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
}
.btn {
    padding: 0.65rem 1.4rem;
    border-radius: 6px;
    font-weight: 500;
    font-size: 0.95rem;
    text-decoration: none;
    transition: all 0.2s ease;
}
.btn-primary {
    background: #2563eb;
    color: #ffffff;
}
.btn-primary:hover {
    background: #1d4ed8;
}
.btn-secondary {
    background: rgba(255, 255, 255, 0.05);
    color: #cbd5e1;
    border: 1px solid rgba(255, 255, 255, 0.1);
}
.btn-secondary:hover {
    background: rgba(255, 255, 255, 0.1);
}
</style>

<script>
(function() {
    var path = window.location.pathname;
    // 如果访问的路径是以 /posts 或 /research 开头，但没有语言前缀，自动无刷新重定向到 /zh/
    if (path.indexOf('/zh/') !== 0 && path.indexOf('/en/') !== 0 && path.indexOf('/ja/') !== 0) {
        if (path.indexOf('/posts') === 0 || path.indexOf('/research') === 0) {
            var target = '/zh' + path;
            window.location.replace(target);
        }
    }
})();
</script>
{{ end }}
