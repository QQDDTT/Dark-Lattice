baseURL = 'https://blog.evotensor.dev/'
locale = 'zh-cn'
defaultContentLanguage = 'zh'
defaultContentLanguageInSubdir = true
canonifyURLs = false
title = 'Dark Lattice'
# theme = 'nightfield' # 使用项目根目录布局，不引用外部主题

[sitemap]
    changefreq = 'daily'
    filename = 'sitemap.xml'
    priority = 0.8

[params]
    author = "Researcher"
    logo = "images/logo.svg"
    favicon = "images/icon.svg"
    googleSiteVerification = "v0qML84AcUySaIID9ZNSGNkDHGEAEtgqynKZyq_PiE0"
    enableRobotsTXT = true
    canonicalURL = true

[languages]
    [languages.zh]
        locale = 'zh-cn'
        label = '简体中文'
        weight = 1
        contentDir = 'content'
        [languages.zh.params]
            label = '简体中文'
            description = "探索深度学习、工业视觉与极致网页设计的交汇点。"
            keywords = ["AI 研究", "网页工程", "深色模式计划", "Hugo 博客"]

    [languages.en]
        locale = 'en-us'
        label = 'English'
        weight = 2
        contentDir = 'content'
        [languages.en.params]
            label = 'English'
            description = "Exploring the intersection of Deep Learning, Industrial Vision, and high-end Web Design."
            keywords = ["AI Research", "Web Engineering", "Dark Mode Design", "Hugo Blog"]

    [languages.ja]
        locale = 'ja-jp'
        label = '日本語'
        weight = 3
        contentDir = 'content'
        [languages.ja.params]
            label = '日本語'
            description = "ディープラーニング、工業用ビジョン、そして最先端ウェブデザインの交差点を探索する。"
            keywords = ["AI 研究", "ウェブエンジニアリング", "ダークモードデザイン", "Hugo ブログ"]

[markup]
    [markup.goldmark]
        [markup.goldmark.renderer]
            unsafe = true
        [markup.goldmark.extensions.passthrough]
            enable = true
            [markup.goldmark.extensions.passthrough.delimiters]
                block = [['$$', '$$'], ['\[', '\]']]
                inline = [['$', '$'], ['\(', '\)']]
    [markup.highlight]
        noClasses = false
        style = "monokai"

[build]

[[menu.main]]
    name = "首页"
    pageRef = "/"
    weight = 1

[[menu.main]]
    name = "博客"
    pageRef = "/posts"
    weight = 2

[[menu.main]]
    name = "研究"
    pageRef = "/research"
    weight = 3

[languages.en.menu]
    [[languages.en.menu.main]]
        name = "Home"
        pageRef = "/"
        weight = 1
    [[languages.en.menu.main]]
        name = "Blog"
        pageRef = "/posts"
        weight = 2
    [[languages.en.menu.main]]
        name = "Research"
        pageRef = "/research"
        weight = 3

[languages.ja.menu]
    [[languages.ja.menu.main]]
        name = "ホーム"
        pageRef = "/"
        weight = 1
    [[languages.ja.menu.main]]
        name = "ブログ"
        pageRef = "/posts"
        weight = 2
    [[languages.ja.menu.main]]
        name = "研究"
        pageRef = "/research"
        weight = 3
